server:
  port: ${SERVER_PORT:8081}
  # Behind the reverse proxy (or the Vite dev server) that serves the frontend on the same origin
  # (ADR 0009, section 3): login redirects and the callback URL use the browser's host, not ours.
  forward-headers-strategy: framework
  tomcat:
    servlet:
      # Redirects of our own (after login: Location "/") stay relative, so the browser resolves
      # them against the host it is on and they never depend on forwarded headers. Spring Boot's
      # default since 4.2; set here so a change of default cannot flip it silently.
      use-relative-redirects: true
  servlet:
    session:
      # The session id is the only thing the browser holds. __Host- makes the browser refuse the
      # cookie unless it is Secure, has Path=/ and no Domain, so it never reaches another host.
      cookie:
        name: ${TALDO_SESSION_COOKIE_NAME:__Host-session}
        http-only: true
        secure: true
        same-site: strict
        path: /

spring:
  application:
    name: "Taldo BFF"
  threads:
    virtual:
      enabled: true

  # Calls to taldo-api: one attempt may wait for at most 15 seconds, like taldo-api's own outbound
  # calls. The JDK client reports a timeout as an I/O error, which the relay answers with 502.
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 15s
      imperative:
        factory: jdk

  # Sessions live in PostgreSQL, so every instance sees them and a restart keeps users logged in.
  # The idle timeout matches Keycloak's SSO session idle (ADR 0006, revision 2026-11-21, point 6):
  # set both from the same value. Keycloak's 36-hour maximum ends the session through the refresh
  # token.
  session:
    timeout: ${TALDO_SESSION_IDLE_TIMEOUT:24h}
    jdbc:
      initialize-schema: always
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # The confidential client the browser logs in with. The issuer's discovery document supplies the
  # endpoints, including end_session_endpoint for logout; it is read at startup, so Keycloak must be
  # reachable then.
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:taldo-web}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/callback"
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
            user-name-attribute: sub

taldo:
  api:
    # taldo-api as the BFF reaches it, without its context path; in production a private address.
    base-url: ${TALDO_API_BASE_URL}

logging:
  level:
    eu.taldo: ${LOGGING_LEVEL_APP:INFO}
