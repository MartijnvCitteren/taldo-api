name: taldo-infra

services:
  # PostgreSQL 17: the newest major version Scaleway Managed Database for PostgreSQL offers, so local matches the
  # hosted engine. Creates the application database (taldo_db) on the first start of an empty volume. Published on
  # host port 5433, not 5432: a PostgreSQL installed on the host (e.g. Postgres.app) takes localhost:5432 first, and
  # the backend would then silently connect to that server instead.
  postgres:
    image: postgres:17.12
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Super_secret-123"
      POSTGRES_DB: taldo_db
    ports:
      - "5433:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d taldo_db" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Creates Keycloak's database and the BFF's session database (taldo_bff_db), also on a volume that already exists. PostgreSQL databases are UTF-8 by default and
  # use MVCC, so the collation and READ_COMMITTED_SNAPSHOT settings SQL Server needed are not required here.
  postgres-init:
    image: postgres:17.12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: "Super_secret-123"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >-
        (psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak_db'" | grep -q 1 || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE keycloak_db")
        && (psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'taldo_bff_db'" | grep -q 1 || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE taldo_bff_db")
    restart: "no"

  # Identity provider (ADR 0006), development mode. The realm in docker/keycloak/ is imported on the first start
  # only; after changing it, remove the realm in the admin console or reset the volumes (docker compose down -v).
  # Its environment-specific values (redirect URIs, SMTP) are placeholders whose defaults are the local ones. A hosted
  # environment runs docker/keycloak/Dockerfile instead.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    command: [ "start-dev", "--import-realm" ]
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak_db"
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: "Super_secret-123"
      KC_HEALTH_ENABLED: "true"
      # Read by the realm import (${...} placeholder); the backend gets the same value.
      TALDO_BACKEND_CLIENT_SECRET: ${TALDO_BACKEND_CLIENT_SECRET:-local-only-backend-secret}
      # The confidential client the BFF (taldo-bff) logs the browser in with (ADR 0009).
      TALDO_WEB_CLIENT_SECRET: ${TALDO_WEB_CLIENT_SECRET:-local-only-web-secret}
      # RFC 9106's second recommended Argon2id option, as ADR 0003 chose for our own hashes: 64 MiB, 3 iterations,
      # parallelism 4. Keycloak's default is 7 MiB, 5 iterations, parallelism 1.
      KC_SPI_PASSWORD_HASHING__ARGON2__MEMORY: "65536"
      KC_SPI_PASSWORD_HASHING__ARGON2__ITERATIONS: "3"
      KC_SPI_PASSWORD_HASHING__ARGON2__PARALLELISM: "4"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/taldo-realm.json:/opt/keycloak/data/import/taldo-realm.json:ro
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Applies the realm settings the import cannot express (see the script), after every start of Keycloak.
  keycloak-config:
    image: quay.io/keycloak/keycloak:26.8.1
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Access token 10 minutes (renewed silently), SSO session 24 hours idle and 36 hours at most (ADR 0006, revision
      # 2026-11-21). Set shorter values to try expiry, e.g. KEYCLOAK_SSO_SESSION_IDLE_SECONDS=300 docker compose up.
      KEYCLOAK_ACCESS_TOKEN_LIFESPAN_SECONDS: ${KEYCLOAK_ACCESS_TOKEN_LIFESPAN_SECONDS:-600}
      KEYCLOAK_SSO_SESSION_IDLE_SECONDS: ${KEYCLOAK_SSO_SESSION_IDLE_SECONDS:-86400}
      KEYCLOAK_SSO_SESSION_MAX_SECONDS: ${KEYCLOAK_SSO_SESSION_MAX_SECONDS:-129600}
      # The public client for local development only (ADR 0009, section 6); no other environment sets this.
      KEYCLOAK_DEV_CLIENT_FILE: /opt/keycloak/taldo-dev-client.json
    entrypoint: [ "/bin/bash", "/opt/keycloak/configure-realm.sh" ]
    volumes:
      - ./docker/keycloak/configure-realm.sh:/opt/keycloak/configure-realm.sh:ro
      - ./docker/keycloak/taldo-dev-client.json:/opt/keycloak/taldo-dev-client.json:ro
    restart: "no"

  # Local SMTP server for the mails Keycloak sends (verification, password reset). Web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: mailpit
    ports:
      - "8025:8025"

  # The applications as the images a hosted environment runs (docker/java/Dockerfile), started only with the apps
  # profile. Build the jars first, then:
  #
  #   ./mvnw package && docker compose --profile apps up --build
  #
  # They take the place of running taldo-api and taldo-bff from the IDE (same ports). Use them to check an image
  # before pushing it: the applications start, reach PostgreSQL and Keycloak, and the BFF relays to taldo-api. A
  # browser login does not work this way: the BFF reaches Keycloak as keycloak:8080, an address the browser cannot
  # open. For login, run the applications on the local profile behind the Vite dev server (docs/application/bff.md).
  taldo-api:
    profiles: [ apps ]
    build:
      context: .
      dockerfile: docker/java/Dockerfile
      args:
        MODULE: taldo-api
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/taldo_db"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "Super_secret-123"
      KEYCLOAK_BASE_URL: "http://keycloak:8080"
      KEYCLOAK_CLIENT_SECRET: ${TALDO_BACKEND_CLIENT_SECRET:-local-only-backend-secret}
      # Generating vacancy texts needs a real key; without one the application starts and generation fails.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-no-key-set}
    ports:
      - "8090:8090"

  taldo-bff:
    profiles: [ apps ]
    build:
      context: .
      dockerfile: docker/java/Dockerfile
      args:
        MODULE: taldo-bff
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
      taldo-api:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/taldo_bff_db"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "Super_secret-123"
      KEYCLOAK_ISSUER_URI: "http://keycloak:8080/realms/taldo"
      KEYCLOAK_CLIENT_SECRET: ${TALDO_WEB_CLIENT_SECRET:-local-only-web-secret}
      TALDO_API_BASE_URL: "http://taldo-api:8090"
    ports:
      - "8081:8081"

volumes:
  postgresdata:
    name: taldo-postgresdata
